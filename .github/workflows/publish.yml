name: Publish to Maven Central

on:
  release:
    types: [created]

concurrency:
  group: maven-publish
  cancel-in-progress: false

jobs:
  publish:
    # Pinned rather than macos-latest, so the Xcode selected below is known to be installed.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kotlin/Native 2.4.x supports Xcode 26.4; the image's default Xcode is newer than that.
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      # The JDK Gradle runs on. The macos-26 image ships Temurin 21 preinstalled (JAVA_HOME_21_arm64),
      # so nothing is downloaded: a download step (actions/setup-java) fetches the JDK from GitHub
      # Releases and fails whenever that service does.
      - name: Use the preinstalled JDK 21
        run: |
          test -n "$JAVA_HOME_21_arm64" || { echo "JDK 21 is not preinstalled on this image"; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_arm64/bin/java" -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper downloads its distribution through services.gradle.org, which redirects to GitHub
      # Releases and fails whenever that service does. The macos-26 image ships Gradle preinstalled;
      # use it when it is exactly the wrapper's version, and fall back to the wrapper otherwise.
      - name: Pick the Gradle launcher
        run: |
          want=$(sed -n 's#^distributionUrl=.*/gradle-\(.*\)-bin\.zip$#\1#p' gradle/wrapper/gradle-wrapper.properties)
          have=$(command -v gradle >/dev/null && gradle --version 2>/dev/null | sed -n 's/^Gradle //p' | head -1 || true)
          echo "wrapper: $want, preinstalled: ${have:-none}"
          if [ -n "$want" ] && [ "$have" = "$want" ]; then
            echo "GRADLE=gradle" >> "$GITHUB_ENV"
          else
            echo "GRADLE=./gradlew" >> "$GITHUB_ENV"
          fi

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_KEY }}" | base64 --decode | gpg --batch --import

      # No test step: the full test suite is run locally before a release is cut (RELEASING.md,
      # "Before You Start"), so the workflow only publishes. The CI test runners (iOS and wasmJs
      # binaries tied to skiko) are not reproducible on the hosted runners.
      - name: Publish to Maven Central
        run: >-
          $GRADLE
          :paginator-core:publishAndReleaseToMavenCentral
          :paginator-offset:publishAndReleaseToMavenCentral
          :paginator-cursor:publishAndReleaseToMavenCentral
          :paginator-view-core:publishAndReleaseToMavenCentral
          :paginator-view-offset:publishAndReleaseToMavenCentral
          :paginator-view-cursor:publishAndReleaseToMavenCentral
          :paginator-compose-core:publishAndReleaseToMavenCentral
          :paginator-compose-offset:publishAndReleaseToMavenCentral
          :paginator-compose-cursor:publishAndReleaseToMavenCentral
          :paginator-bom:publishAndReleaseToMavenCentral
          --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
