name: Publish to Maven Central

on:
  release:
    types: [created]

concurrency:
  group: maven-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_KEY }}" | base64 --decode | gpg --batch --import

      - name: Verify build
        run: >-
          ./gradlew
          :paginator-core:check
          :paginator-offset:check
          :paginator-cursor:check
          :paginator-view-core:check
          :paginator-view-offset:check
          :paginator-view-cursor:check
          :paginator-compose-core:check
          :paginator-compose-offset:check
          :paginator-compose-cursor:check
          :paginator-bom:check
          --no-configuration-cache

      - name: Publish to Maven Central
        run: >-
          ./gradlew
          :paginator-core:publishAndReleaseToMavenCentral
          :paginator-offset:publishAndReleaseToMavenCentral
          :paginator-cursor:publishAndReleaseToMavenCentral
          :paginator-view-core:publishAndReleaseToMavenCentral
          :paginator-view-offset:publishAndReleaseToMavenCentral
          :paginator-view-cursor:publishAndReleaseToMavenCentral
          :paginator-compose-core:publishAndReleaseToMavenCentral
          :paginator-compose-offset:publishAndReleaseToMavenCentral
          :paginator-compose-cursor:publishAndReleaseToMavenCentral
          :paginator-bom:publishAndReleaseToMavenCentral
          --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
