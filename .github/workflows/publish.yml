name: Publish to Maven Central

on:
  release:
    types: [created]

concurrency:
  group: maven-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_KEY }}" | base64 --decode | gpg --batch --import

      # Verify only the JVM / Android unit tests before publishing.
      #
      # We deliberately do NOT run `:check` (which triggers `allTests` → iOS + wasmJs
      # test binaries). Those test runners fail on toolchain/runtime infrastructure
      # tied to `skiko` (the Compose graphics engine), NOT on the library logic:
      #   * iOS  — `linkDebugTestIosSimulatorArm64`: cached skiko / compose-ui-uikit
      #            klibs reference a private UIKit symbol (`UIViewLayoutRegion`) from a
      #            newer iOS SDK, so `ld` reports "Undefined symbols for arm64".
      #   * wasm — `wasmJsNodeTest`: skiko's `.wasm` fails to load under Node.
      # The published artifacts (the iOS / wasmJs `.klib`s) still build during the
      # publish step, so those targets stay fully supported. The common test logic
      # runs identically on the JVM, so coverage is preserved.
      - name: Verify build (JVM / Android unit tests)
        run: >-
          ./gradlew
          :paginator-core:jvmTest
          :paginator-offset:jvmTest
          :paginator-cursor:jvmTest
          :paginator-compose-core:jvmTest
          :paginator-compose-offset:jvmTest
          :paginator-compose-cursor:jvmTest
          :paginator-view-core:testDebugUnitTest
          :paginator-view-offset:testDebugUnitTest
          :paginator-view-cursor:testDebugUnitTest
          --no-configuration-cache

      - name: Publish to Maven Central
        run: >-
          ./gradlew
          :paginator-core:publishAndReleaseToMavenCentral
          :paginator-offset:publishAndReleaseToMavenCentral
          :paginator-cursor:publishAndReleaseToMavenCentral
          :paginator-view-core:publishAndReleaseToMavenCentral
          :paginator-view-offset:publishAndReleaseToMavenCentral
          :paginator-view-cursor:publishAndReleaseToMavenCentral
          :paginator-compose-core:publishAndReleaseToMavenCentral
          :paginator-compose-offset:publishAndReleaseToMavenCentral
          :paginator-compose-cursor:publishAndReleaseToMavenCentral
          :paginator-bom:publishAndReleaseToMavenCentral
          --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
